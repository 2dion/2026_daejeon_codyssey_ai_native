services:
  - type: web
    name: naedon-assistant-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_BACKEND
        value: firestore
      - key: CODYSSEY_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: CODYSSEY_MODEL
        value: gpt-5.4-mini
      - key: MAX_AI_OUTPUT_TOKENS
        value: 500
      - key: CODYSSEY_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
